# CI de heurix-site (25 aout 2026).
#
# POURQUOI CE FICHIER EXISTE. Ce depot n'avait aucune verification
# automatique, et deux defauts en sont sortis la meme semaine, tous deux
# invisibles jusqu'a ce qu'on les cherche :
#
#   1. Un test rouge pendant 39 commits et deux jours. Le commit qui l'a
#      casse (af0156a, 21 aout) annonce « 170 tests verts » dans son propre
#      message -- la suite n'avait pas ete relancee. Le code etait juste,
#      c'est la fixture qui etait perimee.
#
#   2. Seize pages de solutions/ servaient un styles.css vieux de huit jours
#      et un consent.js du 27 juillet, parce que bump-version.sh (supprime
#      le 26 aout 2026, remplace par scripts/bust-cache.sh) ne parcourait
#      pas ce dossier ET ne verifiait que son propre perimetre. Il
#      affichait « une seule version dans tout le site » alors que 114
#      references etaient perimees.
#
# Les deux etapes ci-dessous rendent ces deux situations impossibles.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derniers-articles:
    name: Liste des derniers articles a jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Ce controle lit la date du commit qui a AJOUTE chaque article :
          # il lui faut l'historique complet, pas les deux derniers commits.
          fetch-depth: 0

      - name: HEURIX_SEARCH_LATEST_PATHS reflete-t-il les cinq derniers ?
        run: |
          # Les deux listes ont ete ecrites a la main le 6 aout 2026 (7 entrees
          # en FR, 3 en EN) et n'avaient plus bouge vingt jours plus tard : la
          # modale de recherche annoncait « Latest articles » en proposant les
          # articles classes 23e, 27e et 29e sur 30. Rien ne le signalait --
          # une liste perimee reste du JavaScript valide.
          scripts/derniers-articles.py --verifier

  tests:
    name: Suite de tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run

  cache-busting:
    name: Clefs de cache a jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deux commits : il faut le precedent pour savoir ce qui a change.
          fetch-depth: 2

      - name: Tout asset modifie doit voir sa clef ?v= bouger
        run: |
          set -euo pipefail

          # Sur un push initial (pas de parent), rien a comparer.
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "Pas de commit parent -- verification ignoree."
            exit 0
          fi

          # UN ACTIF EST CE QU'UNE PAGE REFERENCE AVEC ?v= (27 aout 2026).
          # La version precedente filtrait sur '*.js' '*.css' puis retirait
          # quatre dossiers a la main. Deux enumerations, deux angles morts :
          # les .svg de img/ n'etaient jamais verifies, et les
          # telechargeables .tpl / .zip / .html de downloads/ non plus. Le
          # jour ou un correctif de securite est parti dans un de ces
          # fichiers, rien n'aurait signale que sa clef n'avait pas bouge.
          #
          # On ne filtre donc plus par extension ni par dossier : on croise
          # les fichiers modifies avec la liste DERIVEE des actifs
          # versionnes. Un fichier de tests ne s'y trouve jamais, puisque
          # aucune page ne le reference -- la liste d'exclusion devient
          # inutile au lieu d'etre maintenue.
          git grep -hoE "\"(\.\./)*[A-Za-z0-9_/-]+\.[a-z0-9]{2,4}\?v=[0-9]+" HEAD -- '*.html' \
            | sed -E 's|^"(\.\./)*||; s|\?v=[0-9]+$||' | sort -u > /tmp/actifs-versionnes.txt
          MODIFIES=$(git diff --name-only HEAD~1 HEAD \
                     | grep -Fx -f /tmp/actifs-versionnes.txt || true)

          if [ -z "$MODIFIES" ]; then
            echo "Aucun asset .js/.css modifie dans ce commit."
            exit 0
          fi

          ECHEC=0
          for F in $MODIFIES; do
            # LE CHEMIN DU DEPOT, PAS LE BASENAME (27 aout 2026). basename
            # rendait "heurix-search.js" pour downloads/heurix-search.js, et
            # l'ancre "(\.\./)*heurix-search.js" ne voit aucune des 8
            # references reelles, qui traversent toutes le dossier
            # downloads/. Le controle ne les manquait pas bruyamment : il
            # concluait "aucune reference ?v=, ignore" et passait au suivant.
            # Un asset servi depuis un sous-dossier n'a donc jamais ete
            # verifie. Le chemin complet est l'identite ; les remontees ../
            # restent libres devant lui.
            BASE=$(printf '%s' "$F" | sed 's/[.]/\\./g')
            # Les clefs de CE fichier, avant et apres le commit.
            # (\.\./)* ET NON (\.\./)? -- voir le commentaire de l'etape
            # suivante : le "?" ne voyait pas les pages de profondeur 2.
            # tail -1 ET NON head -1 : ce sont des horodatages unix a 10
            # chiffres, donc l'ordre lexicographique est l'ordre numerique,
            # et la DERNIERE valeur est la plus fraiche. head -1 rendait la
            # plus ANCIENNE -- s'il subsistait une clef perimee quelque part,
            # le controle comparait deux fois cette relique et concluait
            # "n'a pas bouge" sur un asset pourtant correctement bumpe.
            AVANT=$(git show "HEAD~1:$F" >/dev/null 2>&1 && \
                    git grep -hoE "\"(\.\./)*${BASE}\?v=[0-9]+" HEAD~1 -- '*.html' '*.js' \
                      | grep -oE '[0-9]+$' | sort -u | tail -1 || true)
            APRES=$(git grep -hoE "\"(\.\./)*${BASE}\?v=[0-9]+" HEAD -- '*.html' '*.js' \
                      | grep -oE '[0-9]+$' | sort -u | tail -1 || true)

            # Un fichier jamais reference par une clef ?v= n'est pas concerne
            # (un module ES importe par un autre, par exemple).
            if [ -z "$APRES" ]; then
              echo "  - $F : aucune reference ?v=, ignore."
              continue
            fi

            if [ "$AVANT" = "$APRES" ]; then
              echo "  ECHEC $F : modifie, mais ?v=$APRES n'a pas bouge."
              ECHEC=1
            else
              echo "  OK    $F : ?v=$AVANT -> ?v=$APRES"
            fi
          done

          if [ "$ECHEC" -ne 0 ]; then
            echo ""
            echo "Un asset a change sans que sa clef de cache bouge : les"
            echo "visiteurs qui l'ont deja en cache ne verront pas la"
            echo "modification. Lancez scripts/bust-cache.sh sur le ou les"
            echo "fichiers signales, puis recommitez."
            exit 1
          fi

      - name: Toutes les pages servent-elles la meme version d'un asset donne ?
        run: |
          set -euo pipefail
          # Repere le defaut de solutions/ : un meme fichier reference sous
          # deux clefs differentes selon la page. L'ancien bump-version.sh
          # (supprime le 26 aout 2026) ne voyait que son propre perimetre et
          # ne pouvait pas le detecter.
          #
          # CE CONTROLE PORTAIT LUI-MEME LES DEUX DEFAUTS QU'IL TRAQUE
          # (corrige le 26 aout 2026) :
          #
          #   1. "(\.\./)?" n'autorisait qu'UN niveau de remontee. Les 76
          #      pages de en/blog/ et en/solutions/ ecrivent
          #      "../../styles.css" : il ne les voyait pas. Rejoue sur
          #      1cbe26bc, il annoncait « OK styles.css : une seule clef sur
          #      tout le site » alors que 38 pages en servaient une autre
          #      depuis leur creation. Le garde-fou etait aveugle exactement
          #      la ou il devait voir.
          #
          #   2. La liste des assets etait ENUMEREE a la main. C'est la
          #      maladie meme de bump-version.sh, corrigee trois fois chez
          #      lui avant d'etre remplacee par une decouverte. Un nouvel
          #      asset versionne n'etait couvert par personne, en silence.
          #      Elle est desormais DEDUITE des references reellement
          #      presentes dans le depot.
          # LA CLASSE INCLUT "/" (27 aout 2026). Sans lui, l'extraction
          # rendait "heurix-search.js" la ou la page ecrit
          # "../downloads/heurix-search.js", puis cherchait cette forme-la
          # et ne trouvait que les extraits de documentation. Le controle
          # a donc certifie "une seule clef sur tout le site" pendant que
          # 8 pages en servaient une autre -- exactement la faute que
          # l'en-tete ci-dessus decrit, un cran plus loin. L'identite d'un
          # asset est son chemin, pas son nom de fichier.
          # L'EXTENSION EST DERIVEE, PAS ENUMEREE (27 aout 2026). (css|js|svg)
          # laissait dehors les quatre telechargeables de downloads/ servis
          # en .tpl, .zip et .html -- dont heurix-tracker.js, .js pourtant,
          # mais sans clef du tout jusqu'a ce jour. Mesure avant/apres :
          # 24 actifs decouverts contre 27, les trois nouveaux etant les
          # non-js de downloads/, et les 27 existent tous sur disque.
          ASSETS=$(git grep -hoE "\"(\.\./)*[A-Za-z0-9_/-]+\.[a-z0-9]{2,4}\?v=[0-9]+" -- '*.html' \
                   | sed -E 's|^"(\.\./)*||; s|\?v=[0-9]+$||' | sort -u)
          echo "Assets versionnes decouverts : $(echo "$ASSETS" | tr '\n' ' ')"
          ECHEC=0
          for BASE in $ASSETS; do
            N=$(git grep -hoE "\"(\.\./)*${BASE}\?v=[0-9]+" -- '*.html' \
                | grep -oE '[0-9]+$' | sort -u | wc -l | tr -d ' ')
            if [ "$N" -gt 1 ]; then
              echo "  ECHEC $BASE : $N clefs ?v= differentes selon la page."
              git grep -lE "\"(\.\./)*${BASE}\?v=[0-9]+" -- '*.html' | while read -r PAGE; do
                V=$(grep -hoE "\"(\.\./)*${BASE}\?v=[0-9]+" "$PAGE" | grep -oE '[0-9]+$' | head -1)
                echo "      $V  $PAGE"
              done | sort | awk '{c[$1]++; ex[$1]=$2} END {for (v in c) printf "      %s : %d page(s), ex. %s\n", v, c[v], ex[v]}'
              ECHEC=1
            else
              echo "  OK    $BASE : une seule clef sur tout le site."
            fi
          done
          [ "$ECHEC" -eq 0 ] || { echo ""; echo "Lancez scripts/bust-cache.sh sur les fichiers signales."; exit 1; }
