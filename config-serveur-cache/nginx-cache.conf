# Equivalent nginx du fichier apache-htaccess-cache.conf -- meme logique,
# meme avertissement : prepare mais jamais deploye ni teste en conditions
# reelles, l'acces SSH etant bloque depuis debut aout. A inclure dans le
# bloc server{} du site (typiquement /etc/nginx/sites-available/heurix.fr),
# puis `nginx -t` pour valider la syntaxe avant `systemctl reload nginx`.

location ~* \.woff2$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Images et videos -- PAS versionnees actuellement (pas de ?v=), duree
# courte : une duree longue empecherait un visiteur ayant deja le fichier
# en cache de recevoir une future mise a jour avant expiration.
location ~* \.(jpg|jpeg|png|svg|webm|mp4)$ {
    expires 1w;
    add_header Cache-Control "public";
}

# CSS/JS -- la plupart versionnes par ?v=, mais tous ne le sont pas
# encore (search-engine.js, nav-dropdown.js, pricing-nudge.js). Duree
# prudente en attendant ce menage, plutot qu'une duree longue aveugle.
location ~* \.(css|js)$ {
    expires 1w;
    add_header Cache-Control "public";

    # Fichiers vraiment versionnes (?v=xxx) : cache long et immutable,
    # une future mise a jour change l'URL et force le rechargement.
    if ($args ~ "v=") {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
