# Configuration cache HTTP -- audit Lighthouse du 10 aout 2026
# ("Utiliser des durees de mise en cache efficaces", 608 Kio d'economies
# estimees, tout servi actuellement en 10min de TTL).
#
# A deposer/inclure sur le serveur OVH une fois l'acces SSH retabli --
# fichier prepare mais jamais deploye, l'acces etant bloque depuis debut
# aout. Non teste en conditions reelles : a verifier sur une page avant
# adoption generale (curl -I sur un vrai fichier pour confirmer les
# en-tetes Cache-Control envoyes).
#
# DEUX DUREES DIFFERENTES, PAS UNE REGLE UNIQUE :
# - Fichiers versionnes par ?v=xxx (styles.css, la plupart des .js, les
#   fonts) : le navigateur ne les recharge jamais depuis le cache une
#   fois l'URL changee -- donc une duree tres longue (1 an) est sans
#   risque, une future mise a jour change l'URL et force le rechargement.
# - Fichiers SANS ce versionnement (search-engine.js, nav-dropdown.js,
#   pricing-nudge.js, les images/videos) : une duree trop longue
#   empecherait un visiteur ayant deja mis le fichier en cache de
#   recevoir une future mise a jour avant l'expiration. Duree plus
#   courte (1 semaine) en attendant que ces fichiers recoivent aussi un
#   ?v=, comme les autres.

<IfModule mod_expires.c>
  ExpiresActive On

  # Fonts -- ne changent quasiment jamais, et sont deja versionnees
  ExpiresByType font/woff2 "access plus 1 year"

  # Images et videos -- PAS versionnees actuellement, duree courte
  ExpiresByType image/jpeg "access plus 1 week"
  ExpiresByType image/png "access plus 1 week"
  ExpiresByType image/svg+xml "access plus 1 week"
  ExpiresByType video/webm "access plus 1 week"
  ExpiresByType video/mp4 "access plus 1 week"

  # CSS et JS -- la plupart versionnes par ?v=, mais Apache ne peut pas
  # distinguer un fichier versionne d'un autre par cette seule directive
  # de type MIME -- duree prudente (1 semaine) tant que TOUS les .js ne
  # sont pas versionnes. A remonter a 1 an une fois ce menage fait.
  ExpiresByType text/css "access plus 1 week"
  ExpiresByType application/javascript "access plus 1 week"
  ExpiresByType text/javascript "access plus 1 week"
</IfModule>

<IfModule mod_headers.c>
  # immutable : indique au navigateur de ne meme pas revalider avant
  # expiration -- utile uniquement sur du contenu vraiment versionne.
  <FilesMatch "\.(css|js)$">
    <If "%{QUERY_STRING} =~ /v=/">
      Header set Cache-Control "public, max-age=604800, immutable"
    </If>
  </FilesMatch>
</IfModule>
