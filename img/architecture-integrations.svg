<svg viewBox="0 0 680 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-title ai-desc">
  <title id="ai-title">Deux flux entre votre boutique et Heurix, et le seul point où les plateformes diffèrent</title>
  <desc id="ai-desc">Deux flèches relient votre boutique à l'API Heurix. La synchronisation part de la boutique : à chaque création, modification ou suppression de produit, la fiche est poussée vers /v1/index/catalogue/items. La recherche part de la requête d'un client et revient en résultats classés. PrestaShop, WooCommerce et Magento appellent l'API directement depuis leur code serveur, la clé restant dans la configuration. Shopify ne peut pas détenir de clé secrète dans un thème : un relais serverless s'intercale, et lui seul détient la clé.</desc>
  <rect x="0" y="0" width="680" height="356" rx="14" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="1"/>

  <text x="340" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="13" font-weight="700" fill="#12142B">Deux flux, et un seul point où les plateformes diffèrent</text>

  <!-- boutique -->
  <rect x="24" y="72" width="180" height="104" rx="12" fill="#FBFBFD" stroke="#E7E9F2" stroke-width="1"/>
  <text x="114" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="12.5" font-weight="700" fill="#12142B">Votre boutique</text>
  <text x="114" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">PrestaShop · WooCommerce</text>
  <text x="114" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">Magento · Shopify</text>
  <text x="114" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" fill="#888780">le catalogue vit ici, et y reste</text>

  <!-- Heurix -->
  <rect x="476" y="72" width="180" height="104" rx="12" fill="#EEF1FF" stroke="#3F52E8" stroke-width="1.6"/>
  <text x="566" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="12.5" font-weight="700" fill="#3F52E8">API Heurix</text>
  <text x="566" y="120" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#3F52E8">api.heurix.fr</text>
  <text x="566" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">le pack de votre secteur</text>
  <text x="566" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" fill="#888780">annote à l'indexation</text>

  <!-- flux 1 : synchronisation, boutique -> Heurix -->
  <path d="M212 106 L468 106" fill="none" stroke="#1FAA6B" stroke-width="2" stroke-linecap="round"/>
  <path d="M461 99 L469 106 L461 113" fill="none" stroke="#1FAA6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="340" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#1FAA6B">1 · Synchroniser</text>
  <text x="340" y="122" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9.5" fill="#5B5E76">POST /v1/index/&lt;catalogue&gt;/items</text>
  <text x="340" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" fill="#888780">à chaque création, modification, suppression</text>

  <!-- flux 2 : recherche, boutique -> Heurix -> boutique -->
  <path d="M468 158 L212 158" fill="none" stroke="#3F52E8" stroke-width="2" stroke-linecap="round"/>
  <path d="M219 151 L211 158 L219 165" fill="none" stroke="#3F52E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="340" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#3F52E8">2 · Chercher</text>
  <text x="340" y="194" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" fill="#888780">la requête part, les résultats classés reviennent</text>

  <!-- LE SEUL POINT DE DIVERGENCE -->
  <line x1="24" y1="222" x2="656" y2="222" stroke="#E7E9F2" stroke-width="1"/>
  <text x="24" y="246" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" font-weight="700" fill="#888780" letter-spacing="0.6">OÙ TOURNE LE CODE QUI DÉTIENT LA CLÉ</text>

  <rect x="24" y="258" width="300" height="72" rx="10" fill="#E8F8F0" stroke="#1FAA6B" stroke-width="1.3"/>
  <text x="174" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#1FAA6B">PrestaShop · WooCommerce · Magento</text>
  <text x="174" y="298" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" fill="#5B5E76">Le code tourne déjà côté serveur.</text>
  <text x="174" y="314" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" fill="#5B5E76">La clé reste dans la configuration.</text>

  <rect x="356" y="258" width="300" height="72" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.3"/>
  <text x="506" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#BA7517">Shopify</text>
  <text x="506" y="298" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" fill="#5B5E76">Un thème ne peut pas détenir de clé secrète.</text>
  <text x="506" y="314" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" fill="#5B5E76">Un relais serverless s'intercale, et la détient.</text>
</svg>
