  <title id="prism-title">How Heurix decomposes a product reference, the way a prism splits light — same mechanic across two different sectors</title>
  <desc id="prism-desc">Two raw references, one hardware (M8 x 20 - Stainless A2) and one fashion (Jeans W32/L34 - Raw denim), each pass through the Heurix lens and come out decomposed into three distinct, usable pieces of information.</desc>

