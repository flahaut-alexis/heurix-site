<svg viewBox="0 0 680 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-title ai-desc">
  <title id="ai-title">Two flows between your store and Heurix, and the one point where platforms differ</title>
  <desc id="ai-desc">Two arrows connect your store to the Heurix API. Synchronisation starts from the store: on every product create, update or delete, the record is pushed to POST /v1/index/catalog/items. Search starts from a customer query and comes back as ranked results. PrestaShop, WooCommerce and Magento call the API directly from their server-side code, the key staying in the configuration. Shopify cannot hold a secret key in a theme: a serverless relay sits in between and holds it.</desc>
  <rect x="0" y="0" width="680" height="356" rx="14" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="1"/>

  <text x="340" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="13" font-weight="700" fill="#12142B">Two flows, and the one point where platforms differ</text>

  <!-- boutique -->
  <rect x="24" y="72" width="180" height="104" rx="12" fill="#FBFBFD" stroke="#E7E9F2" stroke-width="1"/>
  <text x="114" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="12.5" font-weight="700" fill="#12142B">Your store</text>
  <text x="114" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">PrestaShop · WooCommerce</text>
  <text x="114" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">Magento · Shopify</text>
  <text x="114" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" fill="#888780">the catalog lives here, and stays</text>

  <!-- Heurix -->
  <rect x="476" y="72" width="180" height="104" rx="12" fill="#EEF1FF" stroke="#3F52E8" stroke-width="1.6"/>
  <text x="566" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="12.5" font-weight="700" fill="#3F52E8">API Heurix</text>
  <text x="566" y="120" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#3F52E8">api.heurix.fr</text>
  <text x="566" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">your industry's rule pack</text>
  <text x="566" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" fill="#888780">annotates at indexing time</text>

  <!-- flux 1 : synchronisation, boutique -> Heurix -->
  <path d="M212 106 L468 106" fill="none" stroke="#1FAA6B" stroke-width="2" stroke-linecap="round"/>
  <path d="M461 99 L469 106 L461 113" fill="none" stroke="#1FAA6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="340" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#1FAA6B">1 · Synchronise</text>
  <text x="340" y="122" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9.5" fill="#5B5E76">POST /v1/index/&lt;catalogue&gt;/items</text>
  <text x="340" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" fill="#888780">on every create, update and delete</text>

  <!-- flux 2 : recherche, boutique -> Heurix -> boutique -->
  <path d="M468 158 L212 158" fill="none" stroke="#3F52E8" stroke-width="2" stroke-linecap="round"/>
  <path d="M219 151 L211 158 L219 165" fill="none" stroke="#3F52E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="340" y="178" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#3F52E8">2 · Search</text>
  <text x="340" y="194" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" fill="#888780">the query goes out, ranked results come back</text>

  <!-- LE SEUL POINT DE DIVERGENCE -->
  <line x1="24" y1="222" x2="656" y2="222" stroke="#E7E9F2" stroke-width="1"/>
  <text x="24" y="246" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" font-weight="700" fill="#888780" letter-spacing="0.6">WHERE THE CODE THAT HOLDS THE KEY RUNS</text>

  <rect x="24" y="258" width="300" height="72" rx="10" fill="#E8F8F0" stroke="#1FAA6B" stroke-width="1.3"/>
  <text x="174" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#1FAA6B">PrestaShop · WooCommerce · Magento</text>
  <text x="174" y="298" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" fill="#5B5E76">The code already runs server-side.</text>
  <text x="174" y="314" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" fill="#5B5E76">The key stays in the configuration.</text>

  <rect x="356" y="258" width="300" height="72" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.3"/>
  <text x="506" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#BA7517">Shopify</text>
  <text x="506" y="298" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" fill="#5B5E76">A theme cannot hold a secret key.</text>
  <text x="506" y="314" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" fill="#5B5E76">A serverless relay sits in between and holds it.</text>
</svg>
