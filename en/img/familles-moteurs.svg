<svg viewBox="0 0 680 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fam-title fam-desc">
  <title id="fam-title">Three families of e-commerce search tools, and the ground each one owns</title>
  <desc id="fam-desc">General-purpose APIs (Algolia, Typesense) provide raw infrastructure whose relevance rules are yours to write; free text is their ground. Plug-and-play solutions (Doofinder, Sensefuel) install without a developer and drive merchandising from a dashboard. Specialised engines such as Heurix understand the structure of a product reference at indexing time. None of the three grounds covers the others.</desc>

  <rect x="0" y="0" width="680" height="392" rx="14" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="1"/>

  <text x="340" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="13" font-weight="700" fill="#12142B">Three families of tools, not one category</text>

  <!-- ═══ 1 · General-purpose APIs ═══ -->
  <g>
    <rect x="24" y="50" width="192" height="268" rx="12" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="1"/>
    <circle cx="120" cy="92" r="20" fill="#E8F8F0" stroke="#1FAA6B" stroke-width="1.3"/>
    <line x1="110" y1="86" x2="130" y2="86" stroke="#1FAA6B" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="110" y1="98" x2="130" y2="98" stroke="#1FAA6B" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="116" cy="86" r="3" fill="#FFFFFF" stroke="#1FAA6B" stroke-width="1.6"/>
    <circle cx="125" cy="98" r="3" fill="#FFFFFF" stroke="#1FAA6B" stroke-width="1.6"/>

    <text x="120" y="139" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="13" font-weight="700" fill="#1FAA6B">General-purpose APIs</text>
    <text x="120" y="161" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11.5" font-weight="700" fill="#12142B">Algolia · Typesense</text>
    <line x1="56" y1="180" x2="184" y2="180" stroke="#E7E9F2" stroke-width="1"/>

    <text x="120" y="203" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">Raw, fast search</text>
    <text x="120" y="219" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">infrastructure.</text>
    <text x="120" y="245" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">Relevance rules, synonyms</text>
    <text x="120" y="261" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">and facets are yours</text>
    <text x="120" y="277" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">to write.</text>
    <text x="120" y="301" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" font-weight="700" fill="#888780">Free text is their ground.</text>
  </g>

  <!-- ═══ 2 · Plug-and-play ═══ -->
  <g>
    <rect x="244" y="50" width="192" height="268" rx="12" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="1"/>
    <circle cx="340" cy="92" r="20" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.3"/>
    <rect x="331" y="83" width="8" height="8" rx="1.5" fill="none" stroke="#BA7517" stroke-width="1.6"/>
    <rect x="342" y="83" width="8" height="8" rx="1.5" fill="none" stroke="#BA7517" stroke-width="1.6"/>
    <rect x="331" y="94" width="8" height="8" rx="1.5" fill="none" stroke="#BA7517" stroke-width="1.6"/>
    <rect x="342" y="94" width="8" height="8" rx="1.5" fill="none" stroke="#BA7517" stroke-width="1.6"/>

    <text x="340" y="139" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="13" font-weight="700" fill="#BA7517">Plug-and-play</text>
    <text x="340" y="161" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11.5" font-weight="700" fill="#12142B">Doofinder · Sensefuel</text>
    <line x1="276" y1="180" x2="404" y2="180" stroke="#E7E9F2" stroke-width="1"/>

    <text x="340" y="203" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">A script or a module,</text>
    <text x="340" y="219" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">no developer needed.</text>
    <text x="340" y="245" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">A dashboard to drive</text>
    <text x="340" y="261" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">merchandising: promoted</text>
    <text x="340" y="277" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">products, banners.</text>
    <text x="340" y="301" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" font-weight="700" fill="#888780">Merchandising is their ground.</text>
  </g>

  <!-- ═══ 3 · Specialised engines ═══ -->
  <g>
    <rect x="464" y="50" width="192" height="268" rx="12" fill="#FFFFFF" stroke="#3F52E8" stroke-width="1.3"/>
    <circle cx="560" cy="92" r="20" fill="#EEF1FF" stroke="#3F52E8" stroke-width="1.3"/>
    <circle cx="557" cy="89" r="8" fill="none" stroke="#3F52E8" stroke-width="1.6"/>
    <line x1="563" y1="95" x2="569" y2="101" stroke="#3F52E8" stroke-width="2.5" stroke-linecap="round"/>

    <text x="560" y="139" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="13" font-weight="700" fill="#3F52E8">Specialised engines</text>
    <rect x="524" y="148" width="72" height="20" rx="10" fill="#EEF1FF"/>
    <text x="560" y="162" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11.5" font-weight="700" fill="#3F52E8">Heurix</text>
    <line x1="496" y1="180" x2="624" y2="180" stroke="#E7E9F2" stroke-width="1"/>

    <text x="560" y="203" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">An API, like Algolia</text>
    <text x="560" y="219" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">and Typesense.</text>
    <text x="560" y="245" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">But the structure of</text>
    <text x="560" y="261" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#12142B">M8 x 20 · W32/L34 · ISBN</text>
    <text x="560" y="277" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" fill="#5B5E76">is understood at indexing time.</text>
    <text x="560" y="301" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10.5" font-weight="700" fill="#3F52E8">The reference is its ground.</text>
  </g>

  <line x1="24" y1="344" x2="656" y2="344" stroke="#E7E9F2" stroke-width="1"/>
  <text x="340" y="370" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" fill="#5B5E76">None of the three grounds covers the others: you choose on the need, not on a ranking.</text>
</svg>
