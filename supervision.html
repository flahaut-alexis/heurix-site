<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervision — Heurix</title>
<meta name="robots" content="noindex, nofollow">
<!--
  PAGE D'EXPLOITANT, séparée de la console client.

  Un distributeur qui consulte son espace se moque de savoir si le serveur
  approche la saturation. Mélanger les deux brouillerait son écran et
  exposerait des chiffres agrégés qui ne le regardent pas.

  Cette page n'est pas référencée depuis le site : elle se connaît ou ne se
  trouve pas. Elle exige la clé admin, saisie à chaque visite et jamais
  stockée — une clé d'administration en localStorage survivrait à un vol de
  poste.
-->
<style>
  :root{
    --fond:#0F1523; --carte:#182234; --ligne:#26334A;
    --texte:#E6EDF7; --attenue:#8FA0BC;
    --bleu:#5B9BF8; --vert:#3DD68C; --ambre:#F5B942; --rouge:#F87171;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:28px 22px 60px;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--fond); color:var(--texte); font-size:15px; line-height:1.5;
  }
  .wrap{ max-width:1080px; margin:0 auto; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sous{ color:var(--attenue); font-size:13.5px; margin:0 0 26px; }

  .connexion{ max-width:420px; }
  .connexion input{
    width:100%; padding:11px 13px; font-size:14px; font-family:inherit;
    background:var(--carte); border:1px solid var(--ligne); border-radius:9px;
    color:var(--texte); margin-bottom:10px;
  }
  button{
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    padding:10px 18px; border-radius:9px; border:none;
    background:var(--bleu); color:#08111F;
  }
  button:hover{ filter:brightness(1.08); }

  .grille{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:14px; }
  .carte{ background:var(--carte); border:1px solid var(--ligne); border-radius:12px; padding:16px 18px; }
  .carte h2{ font-size:11.5px; font-weight:700; text-transform:uppercase;
             letter-spacing:.07em; color:var(--attenue); margin:0 0 10px; }
  .valeur{ font-size:28px; font-weight:800; line-height:1.1; }
  .unite{ font-size:13px; font-weight:600; color:var(--attenue); }
  .detail{ margin-top:9px; font-size:12.5px; color:var(--attenue); line-height:1.6; }

  /* La jauge est le vrai outil de décision : elle dit quand changer de
     palier, pas seulement où on en est. */
  .jauge{ height:7px; background:#0B1220; border-radius:100px; overflow:hidden; margin:11px 0 7px; }
  .jauge i{ display:block; height:100%; background:var(--vert); transition:width .3s; }
  .jauge-ambre i{ background:var(--ambre); }
  .jauge-rouge i{ background:var(--rouge); }

  .alerte{ padding:13px 16px; border-radius:10px; margin-bottom:10px; font-size:13.5px; }
  .alerte-important{ background:#2C2410; border:1px solid #6B5416; color:#F5D48A; }
  .alerte-bloquant{ background:#2C1414; border:1px solid #6B2020; color:#F8A9A9; }
  .rien{ color:var(--vert); font-size:13.5px; margin-bottom:18px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:left; padding:7px 10px; border-bottom:1px solid var(--ligne); }
  th{ color:var(--attenue); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .mono{ font-variant-numeric:tabular-nums; }

  /* Statuts d'inscrit. Aucune couleur nouvelle : les quatre teintes du
     jeu existant suffisent, et chacune dit ce qu'il y a a faire.
       vert  payant              rien a faire
       bleu  essai en cours      rien a faire, mais l'echeance approche
       ambre essai expire        une relance commerciale
       rouge essai sans echeance un defaut a corriger, pas un client a relancer */
  .badge{ display:inline-block; padding:2px 8px; border-radius:100px;
          font-size:11.5px; font-weight:700; letter-spacing:.02em;
          border:1px solid; background:transparent; }
  .b-payant{ color:var(--vert);  border-color:var(--vert); }
  .b-essai{ color:var(--bleu);   border-color:var(--bleu); }
  .b-expire{ color:var(--ambre); border-color:var(--ambre); }
  .b-defaut{ color:var(--rouge); border-color:var(--rouge); }
  /* Une case vide doit se LIRE comme vide, pas se confondre avec un zero. */
  .vide{ color:var(--attenue); }
  .large{ grid-column:1/-1; }
  .erreur{ color:var(--rouge); font-size:13.5px; }
  .maj{ color:var(--attenue); font-size:12px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Supervision Heurix</h1>
  <p class="sous">Vue d'exploitant — agrège tous les comptes. Distincte de la console client.</p>

  <div class="connexion" id="connexion">
    <input type="password" id="cle" placeholder="Clé d'administration" autocomplete="off">
    <button type="button" id="entrer">Afficher</button>
    <p class="detail">La clé n'est pas conservée : elle est redemandée à chaque visite.</p>
    <p class="erreur" id="erreur" hidden></p>
  </div>

  <div id="tableau" hidden></div>
  <p class="maj" id="maj" hidden></p>
</div>

<script>
(function () {
  "use strict";
  var API = "https://api.heurix.fr";
  // Dernière liste d'inscrits reçue. Conservée hors de rendre() parce qu'elle
  // vient d'un SECOND appel : si /v1/admin/accounts échoue ou tarde, le reste
  // de la supervision s'affiche quand même. Un écran d'exploitation qui
  // disparaît en entier parce qu'un de ses blocs manque est un écran de moins
  // au moment où l'on en a besoin.
  var dernierInscrits = null;

  function $(id) { return document.getElementById(id); }
  function n(v) { return (v === null || v === undefined) ? "—" : Number(v).toLocaleString("fr-FR"); }

  function jauge(pct) {
    var classe = pct >= 85 ? "jauge jauge-rouge" : (pct >= 60 ? "jauge jauge-ambre" : "jauge");
    return "<div class='" + classe + "'><i style='width:" + Math.min(100, pct) + "%'></i></div>";
  }

  // Chaque statut porte ce qu'il VEUT DIRE, pas seulement son nom. Un badge
  // rouge qui ne dit pas quoi faire se relit dans six mois comme une alarme
  // dont personne ne connaît la cause -- on la finit par l'ignorer.
  var STATUTS = {
    payant: { texte: "Payant", classe: "b-payant",
              aide: "Abonnement actif. Rien à faire." },
    essai:  { texte: "En essai", classe: "b-essai",
              aide: "Essai de 14 jours en cours. La date de fin est calculée, pas stockée." },
    essai_expire: { texte: "Essai expiré", classe: "b-expire",
              aide: "Les 14 jours sont passés et la clé est restée sur le plan trial : "
                  + "elle fonctionne toujours, plafonnée aux quotas d'essai. "
                  + "Aucun plan « gratuit » n'existe — c'est une relance commerciale." },
    // Pas « En essai ». Une clé `trial` sans date de début n'expire jamais :
    // ce n'est pas un client en essai, c'est une ligne à corriger.
    essai_sans_echeance: { texte: "Essai sans échéance", classe: "b-defaut",
              aide: "Cette clé n'a pas de date de début d'essai : elle n'expirera JAMAIS. "
                  + "Créée par POST /v1/admin/keys, qui ne pose pas de date, ou rétrogradée "
                  + "vers trial par set_plan(), qui n'en pose pas non plus. "
                  + "À corriger : lui attribuer un plan payant, ou lui poser une date de début." }
  };

  function jour(iso) {
    if (!iso) return "<span class='vide'>—</span>";
    var d = new Date(iso);
    return isNaN(d) ? "<span class='vide'>—</span>"
                    : d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  function echapper(v) {
    return String(v === null || v === undefined ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // TABLEAU, PAS GRAPHIQUE. A quatre comptes un histogramme n'apprend rien,
  // tandis qu'un tableau montre par ses cases vides ce qui manque vraiment
  // -- la colonne Périodicité, entièrement vide aujourd'hui, dit que la
  // donnée n'est persistée nulle part. Le graphique viendra quand une courbe
  // signifiera quelque chose.
  function rendreInscrits(c) {
    if (!c || !(c.elements || []).length) return "";
    var h = "<div class='carte large'><h2>Inscrits</h2><table>" +
            "<tr><th>Créé le</th><th>Compte</th><th>Clé</th><th>Plan</th><th>Statut</th>" +
            "<th>Fin d'essai</th><th>Périodicité</th><th>Ranking</th></tr>";
    c.elements.forEach(function (e) {
      var st = STATUTS[e.statut] || { texte: e.statut, classe: "b-defaut" };
      h += "<tr>" +
           "<td class='mono'>" + jour(e.created_at) + "</td>" +
           "<td>" + echapper(e.label || "—") +
             (e.company_id === null
                ? " <span class='vide' title='clé non rattachée à une société'>· sans société</span>"
                : "") +
           "</td>" +
           // La clé sert a retrouver le compte dans error_log, qui la stocke.
           // Affichée telle que l'API la masque, sans rien en retirer : la
           // reformater ici coupleraient cet écran au format de masquer(),
           // et on a déjà appris ce que coûte un format parsé en deux endroits.
           "<td class='mono vide'>" + echapper(e.key_prefix || "—") + "</td>" +
           "<td>" + echapper(e.plan) + "</td>" +
           "<td><span class='badge " + st.classe + "' title=\"" +
             echapper(st.aide) + "\">" + echapper(st.texte) + "</span></td>" +
           "<td class='mono'>" + jour(e.trial_ends_at) + "</td>" +
           "<td class='mono'>" + (e.periodicite
                ? echapper(e.periodicite)
                : "<span class='vide' title=\"non persistée : elle n'existe que chez Stripe\">—</span>") + "</td>" +
           "<td>" + (e.browse_plan && e.browse_plan !== "none"
                ? echapper(e.browse_plan) : "<span class='vide'>—</span>") + "</td>" +
           "</tr>";
    });
    h += "</table>";
    // Légende conditionnelle : expliquer un état que personne n'a serait du
    // bruit. Elle apparaît quand la ligne existe, et dit QUOI FAIRE.
    var nDefaut = (c.par_statut || {}).essai_sans_echeance || 0;
    if (nDefaut) {
      h += "<p class='detail'><span class='badge b-defaut'>Essai sans échéance</span> — " +
           nDefaut + (nDefaut > 1 ? " clés n'ont" : " clé n'a") +
           " pas de date de début d'essai : " + (nDefaut > 1 ? "elles n'expireront" : "elle n'expirera") +
           " jamais. Créée par <code>POST /v1/admin/keys</code>, qui ne pose pas de date, " +
           "ou rétrogradée vers <code>trial</code> par <code>set_plan()</code>, qui n'en pose pas " +
           "non plus. À corriger : attribuer un plan payant, ou poser une date de début.</p>";
    }
    if (c.tronque) {
      h += "<p class='detail'>" + c.elements.length + " sur " + c.total +
           " — pagination active.</p>";
    }
    h += "</div>";
    return h;
  }

  function rendre(d) {
    var h = "";

    (d.alertes || []).forEach(function (a) {
      h += "<div class='alerte alerte-" + a.niveau + "'>" + a.message + "</div>";
    });
    if (!(d.alertes || []).length) {
      h += "<p class='rien'>Aucune alerte.</p>";
    }

    // --- comptes et usage
    h += "<div class='grille'>";
    // Le total compte des COMPTES (societes distinctes + cles orphelines) ;
    // la repartition par plan compte des CLES. On le dit, sinon l'ecran
    // laisse croire que les deux s'additionnent.
    h += "<div class='carte'><h2>Comptes</h2>" +
         "<div class='valeur'>" + n(d.comptes.total) + "</div>" +
         "<div class='detail'>" +
         (d.comptes.sans_societe
            ? "dont " + n(d.comptes.sans_societe) + " clé" +
              (d.comptes.sans_societe > 1 ? "s" : "") + " sans société<br>" : "") +
         n(d.comptes.ayant_indexe) + " ont indexé un catalogue<br>" +
         n(d.comptes.cles_serveur) + " clés serveur — " +
         Object.keys(d.comptes.par_plan).map(function (p) {
           return p + " : " + d.comptes.par_plan[p];
         }).join(" · ") +
         (d.comptes.avec_ranking ? "<br>" + d.comptes.avec_ranking + " avec Ranking" : "") +
         "</div></div>";

    h += "<div class='carte'><h2>Recherches ce mois</h2>" +
         "<div class='valeur'>" + n(d.usage.recherches) + "</div>" +
         "<div class='detail'>Ranking : " + n(d.usage.ranking) + "<br>" +
         "Erreurs 24 h : " + n(d.usage.erreurs_24h) + "</div></div>";

    h += "<div class='carte'><h2>Catalogues</h2>" +
         "<div class='valeur'>" + n(d.catalogues.total) + "</div>" +
         "<div class='detail'>" + n(d.catalogues.produits) + " produits au total</div></div>";
    h += "</div>";

    // Le detail de la tuile « Comptes », juste sous elle : un tableau qui
    // explique un chiffre doit se lire a cote du chiffre, pas trois ecrans
    // plus bas. Les inscrits viennent d'un SECOND appel -- s'il manque, le
    // reste de la supervision s'affiche quand meme.
    h += rendreInscrits(dernierInscrits);

    // --- les deux jauges qui décident du palier
    h += "<div class='grille'>";
    var deb = d.debit;
    h += "<div class='carte'><h2>Débit — pointe sur 7 jours</h2>" +
         "<div class='valeur'>" + deb.pointe_7j_req_s + " <span class='unite'>req/s</span></div>" +
         jauge(deb.charge_pct) +
         "<div class='detail'>Plafond mesuré : " + deb.plafond_mesure_req_s + " req/s en mono-processus.<br>" +
         "Alerte à " + deb.seuil_alerte_req_s + " req/s — au-delà, préparez le multi-processus.<br>" +
         "Actuel : " + deb.actuel_req_s + " req/s</div></div>";

    var s = d.serveur;
    h += "<div class='carte'><h2>Capacité catalogue</h2>" +
         "<div class='valeur'>" + (s.occupation_pct === null ? "—" : s.occupation_pct + " <span class='unite'>%</span>") + "</div>" +
         (s.occupation_pct === null ? "" : jauge(s.occupation_pct)) +
         "<div class='detail'>" + n(d.catalogues.produits) + " produits sur " +
         n(s.capacite_produits_estimee) + " estimés<br>" +
         "Base : 2,45 Ko par produit, 50 % de marge conservée</div></div>";

    h += "<div class='carte'><h2>Serveur</h2>" +
         "<div class='valeur'>" + (s.memoire_service_mo === null ? "—" : s.memoire_service_mo + " <span class='unite'>Mo</span>") + "</div>" +
         "<div class='detail'>Mémoire totale : " + n(s.memoire_totale_mo) + " Mo<br>" +
         "Disque libre : " + s.disque_libre_pct + " % (" + s.disque_libre_go + " Go)</div></div>";
    h += "</div>";

    // --- VEILLE D'ACQUISITION.
    //
    // Ce que les visiteurs de la vitrine cherchent. C'est une donnée
    // qu'aucune autre source ne donne : elle dit quelles verticales
    // intéressent et quel vocabulaire les prospects emploient.
    //
    // Les recherches SANS RÉSULTAT passent en premier : elles nomment les
    // secteurs qui manquent, et c'est l'information la plus actionnable.
    var acq = d.acquisition || {};
    if ((acq.sans_resultat_30j || []).length) {
      h += "<div class='carte'><h2>Ce que les visiteurs ne trouvent pas — 30 jours</h2>" +
           "<p class='detail' style='margin:0 0 10px;'>Chaque terme nomme un secteur " +
           "ou un vocabulaire qui vous manque.</p><table>" +
           "<tr><th>Recherche</th><th>Fois</th></tr>";
      acq.sans_resultat_30j.forEach(function (t) {
        h += "<tr><td>" + t.terme + "</td><td class='mono'>" + t.n + "</td></tr>";
      });
      h += "</table></div>";
    }
    if ((acq.termes_30j || []).length) {
      h += "<div class='carte'><h2>Recherches sur la vitrine — 30 jours</h2><table>" +
           "<tr><th>Recherche</th><th>Fois</th><th>Résultats</th></tr>";
      acq.termes_30j.forEach(function (t) {
        h += "<tr><td>" + t.terme + "</td><td class='mono'>" + t.n +
             "</td><td class='mono'>" + n(t.resultats) + "</td></tr>";
      });
      h += "</table></div>";
    }

    // --- les plus gros catalogues
    if ((d.catalogues.plus_gros || []).length) {
      h += "<div class='carte'><h2>Plus gros catalogues</h2><table>" +
           "<tr><th>Catalogue</th><th>Produits</th></tr>";
      d.catalogues.plus_gros.forEach(function (c) {
        h += "<tr><td>" + c.nom + "</td><td class='mono'>" + n(c.produits) + "</td></tr>";
      });
      h += "</table></div>";
    }

    $("tableau").innerHTML = h;
    $("tableau").hidden = false;
    $("maj").textContent = "Relevé du " + new Date().toLocaleString("fr-FR");
    $("maj").hidden = false;
  }

  // Second appel, volontairement tolérant : il met à jour `dernierInscrits`
  // et n'échoue jamais bruyamment. La supervision doit survivre à l'absence
  // de ce bloc, pas s'éteindre avec lui.
  function chargerInscrits(cle) {
    return fetch(API + "/v1/admin/accounts", { headers: { Authorization: "Bearer " + cle } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (c) { if (c) dernierInscrits = c; })
      .catch(function () {});
  }

  function charger() {
    var cle = $("cle").value.trim();
    if (!cle) return;
    $("erreur").hidden = true;

    fetch(API + "/v1/admin/overview?vitrine=public-demo", { headers: { Authorization: "Bearer " + cle } })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error("Clé refusée.");
        if (!r.ok) throw new Error("Le serveur a répondu " + r.status + ".");
        return r.json();
      })
      .then(function (d) {
        $("connexion").hidden = true;
        // On attend les inscrits pour le PREMIER rendu seulement, afin de ne
        // pas afficher un écran auquel le tableau apparaîtrait une seconde
        // plus tard. Les rafraîchissements suivants ne bloquent rien.
        return chargerInscrits(cle).then(function () {
          rendre(d);
          // Rafraîchissement automatique : cette page sert à SURVEILLER, on
          // la laisse ouverte sur un second écran.
          setInterval(function () {
            Promise.all([
              fetch(API + "/v1/admin/overview?vitrine=public-demo", { headers: { Authorization: "Bearer " + cle } })
                .then(function (r) { return r.ok ? r.json() : null; })
                .catch(function () { return null; }),
              chargerInscrits(cle)
            ]).then(function (res) { if (res[0]) rendre(res[0]); });
          }, 60000);
        });
      })
      .catch(function (e) {
        $("erreur").textContent = e.message;
        $("erreur").hidden = false;
      });
  }

  $("entrer").addEventListener("click", charger);
  $("cle").addEventListener("keydown", function (e) { if (e.key === "Enter") charger(); });
})();
</script>
</body>
</html>
